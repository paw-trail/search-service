<rect x="314" y="746" width="242" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="758" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">POST /internal/verdicts/batch  500곳씩</text>
<polyline points="820,160.0 820,395.0" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
<rect x="782" y="258" width="76" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="820.0" y="269.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#6366F1">기동 시 설정</text>
<polyline points="1010,410 1110,410 1110,120 1410.0,120" fill="none" stroke="#6366F1" stroke-width="2.4" marker-end="url(#ah-6366F1)"/>
