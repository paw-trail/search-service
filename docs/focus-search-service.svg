<text x="1122" y="205" font-size="13" font-weight="normal" text-anchor="start" fill="#6366F1">등록</text>
<polyline points="1010,435 1150,435 1150,290 1410.0,290" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="1158" y="343" width="123" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1162" y="355" font-size="13" font-weight="normal" text-anchor="start" fill="#F97316">JDBC · Flyway V20</text>
<polyline points="1010,460 1410,460" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="1191" y="438" width="119" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1250" y="450" font-size="13" font-weight="normal" text-anchor="middle" fill="#F97316">ZINCRBY · SET NX</text>
<polyline points="1010,485 1230,485 1230,630 1410.0,630" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#ah-16A34A)"/>
<rect x="1238" y="553" width="191" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1242" y="565" font-size="13" font-weight="normal" text-anchor="start" fill="#16A34A">GET /internal/places/indexing</text>
<polyline points="1010,500 1190,500 1190,800 1410.0,800" fill="none" stroke="#9CA3AF" stroke-width="2.4" marker-end="url(#ah-9CA3AF)" stroke-dasharray="7,6"/>
<rect x="1238" y="733" width="175" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="1242" y="745" font-size="13" font-weight="normal" text-anchor="start" fill="#9CA3AF">GET /internal/reviews/stats</text>
<text x="40" y="880" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">색인에는 동반 조건이 없음 — 카드마다 verdict 에 물어 붙임 · 판정 필터 · 탐색 카운트는 후보 전부를 500곳씩 판정 (전국 3.3초 · 서울 0.56초)</text>
<text x="40" y="902" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">place.updated 를 받거나 매일 04:00 재색인 때 place 에서 다시 읽어 덮어씀 — place 수정 시각이 더 새 것만 쓰므로 같은 이벤트가 두 번 와도 결과가 같음</text>
<text x="40" y="924" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">이름 차례는 ko-x-icu — DB 기본 정렬이 한글을 글자 수로 세움 · 조회수는 Redis 에만 · 두 대로 떠도 재색인은 잠금으로 한 번만 돎</text>
<text x="1836" y="948" font-size="11" text-anchor="end" fill="#9CA3AF">search-service 를 중심으로 · 직접 연결된 것만</text></svg>