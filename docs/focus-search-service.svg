<text x="820" y="428" font-size="22" font-weight="bold" text-anchor="middle" fill="#111827">search-service  :8087</text>
<text x="820" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">place 를 옮겨 담은 색인으로 찾음</text>
<text x="820" y="464" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">API 7개  (공개 6 · 관리자 1) · 판정은 verdict 에 물음</text>
<text x="622.0" y="381.0" font-size="13" font-weight="bold" text-anchor="start" fill="#22C55E">이 레포</text>
<rect x="55.0" y="255.0" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.2"/>
<text x="180" y="278" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">gateway-server</text>
<text x="180" y="298" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">토큰 검증</text>
<text x="180" y="314" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">X-User-Id · X-User-Role 주입</text>
<rect x="55.0" y="495.0" width="250" height="90" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="180" y="518" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Kafka</text>
<text x="180" y="538" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">place.updated 를 받음</text>
<text x="180" y="554" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">묶어서 500건씩 · earliest</text>
<rect x="55.0" y="725.0" width="250" height="90" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="180" y="748" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">verdict-service</text>
<text x="180" y="768" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">카드마다 반려동물별 판정</text>
<text x="180" y="784" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">충돌 · 준비물 · 한 줄 근거</text>
<rect x="660.0" y="80.0" width="320" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="820" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">config-server</text>
<text x="820" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">재색인 시각 · 잠금 만료</text>
<rect x="1410.0" y="80.0" width="300" height="80" rx="12" fill="#E0E7FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1560" y="106" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">eureka-server</text>
<text x="1560" y="126" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">등록 · lb:// 해석</text>
<rect x="1410.0" y="240.0" width="300" height="100" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1560" y="268" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">PostgreSQL  search_db</text>
<text x="1560" y="288" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">search_index 한 표 · 24칸</text>
<text x="1560" y="304" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">이름 트라이그램 · 좌표 · 소개문 인덱스</text>
<rect x="1410.0" y="415.0" width="300" height="90" rx="12" fill="#FFEDD5" stroke="#F97316" stroke-width="2.2"/>
<text x="1560" y="438" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">Redis</text>
<text x="1560" y="458" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">조회수 — 전국 · 시도 열쇠</text>
<text x="1560" y="474" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">재색인 잠금  (만료 30분)</text>
<rect x="1410.0" y="585.0" width="300" height="90" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.2"/>
<text x="1560" y="608" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">place-service</text>
<text x="1560" y="628" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">색인용 조회</text>
<text x="1560" y="644" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">ids 100 · 이어받기 500</text>
<rect x="1410.0" y="755.0" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="9,7"/>
<text x="1560" y="778" font-size="17" font-weight="bold" text-anchor="middle" fill="#111827">review-service</text>
<text x="1560" y="798" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">평점 · 후기 수를 100곳씩</text>
<text x="1560" y="814" font-size="12" font-weight="normal" text-anchor="middle" fill="#4B5563">아직 없음 — 그동안 평점은 비어 있음</text>
<polyline points="305.0,300 470,300 470,420 630,420" fill="none" stroke="#3B82F6" stroke-width="2.4" marker-end="url(#ah-3B82F6)"/>
<rect x="314" y="276" width="306" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
<text x="318" y="288" font-size="13" font-weight="normal" text-anchor="start" fill="#3B82F6">검색 · 카운트 · 자동완성 · 인기 · 지역 · 관리자 재색인</text>
<polyline points="305.0,540 520,540 520,460 630,460" fill="none" stroke="#F97316" stroke-width="2.4" marker-end="url(#ah-F97316)"/>
<rect x="314" y="516" width="97" height="19" rx="4" fill="#FFFFFF" opacity="0.92"/>
